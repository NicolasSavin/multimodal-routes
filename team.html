<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Чат работников</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="users.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui,sans-serif;color:#eef3f8;background:#071018}
.bg{position:fixed;inset:0;background:radial-gradient(900px 400px at 0% 0%,#5a1a1a,transparent 55%),radial-gradient(800px 400px at 100% 0%,#7a4a18,transparent 50%),#071018}
.wrap{position:relative;max-width:760px;margin:0 auto;padding:18px 16px 28px;min-height:100vh;display:flex;flex-direction:column}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.nav a,.btn{color:#f3e0b8;background:rgba(255,255,255,.06);border:1px solid rgba(243,224,184,.18);border-radius:999px;padding:10px 14px;text-decoration:none;font:inherit;cursor:pointer}
h1{margin:0 0 6px;font-size:28px}.lead{color:#b7c6d6;margin:0 0 12px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:14px}
input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:#0b1624;color:#fff;font:inherit;margin-top:8px}
.log{flex:1;min-height:380px;max-height:58vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:16px;line-height:1.45}
.bot{align-self:flex-start;background:rgba(255,255,255,.07)}
.me{align-self:flex-end;background:linear-gradient(180deg,#f6e2b4,#c8943c);color:#1a1206}
.msg img,.msg video,.msg audio{max-width:100%;border-radius:12px;margin-top:8px;display:block}
.who{font-size:11px;opacity:.75;margin-bottom:4px}
.bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.bar input[type=text]{flex:1;min-width:160px;margin:0}
.go{border:0;cursor:pointer;padding:12px 16px;border-radius:999px;font:inherit;font-weight:700;color:#1a1206;background:linear-gradient(180deg,#f6e2b4,#c8943c)}
.err{color:#f3b4b4}
</style>
</head>
<body>
<div class="bg"></div>
<div id="gate" class="wrap">
<div class="card" style="max-width:420px;margin:40px auto;width:100%">
<h1>Вход</h1>
<p class="lead">Чат только для сотрудников.</p>
<input id="login" placeholder="Логин"><input id="pass" type="password" placeholder="Пароль">
<p class="err" id="err"></p>
<button class="btn" type="button" style="margin-top:14px" onclick="enter()">Войти</button>
</div></div>
<div id="app" class="wrap" style="display:none">
<div class="nav">
<a href="index.html">Маршруты</a>
<a href="hotels.html">Гостиницы</a>
<a href="where.html">Кто где</a>
<a href="chat.html">ИИ помощник</a>
<button class="btn" type="button" onclick="out()">Выйти</button>
</div>
<h1>Чат работников</h1>
<p class="lead">Чат только для сотрудников, вход по паролю. Можно фото, видео, аудио. Справа внизу — SOS.</p>
<div class="card log" id="log"></div>
<div class="bar">
<input id="q" type="text" placeholder="Сообщение">
<input id="file" type="file" accept="image/*,video/*,audio/*" style="width:auto;max-width:180px;margin:0">
<button class="go" type="button" onclick="send()">Отправить</button>
</div>
</div>
<script>
var KEY="mm_user", API="https://functions.yandexcloud.net/d4e5aa975qllld89nvh0";
function norm(s){return String(s||"").trim().toLowerCase().replace(/ё/g,"е");}
function user(){ try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){return null;} }
function enter(){
var l=norm(document.getElementById("login").value), p=String(document.getElementById("pass").value||"").trim();
var u=(window.HOTEL_USERS||[]).find(function(x){return norm(x.login)===l && String(x.pass)===p;});
if(!u){document.getElementById("err").textContent="Неверный логин или пароль"; return;}
localStorage.setItem(KEY, JSON.stringify({login:u.login, admin:!!u.admin, name:u.name||u.login}));
show();
}
function out(){ localStorage.removeItem(KEY); location.reload(); }
function add(m){
var me=user() && norm(m.login)===norm(user().login);
var d=document.createElement("div");
d.className="msg "+(me?"me":"bot");
var media="";
if(m.media){
  if((m.kind||"").indexOf("video")===0) media="<video controls src='"+m.media+"'></video>";
  else if((m.kind||"").indexOf("audio")===0) media="<audio controls src='"+m.media+"'></audio>";
  else media="<img src='"+m.media+"' alt=''>";
}
d.innerHTML="<div class='who'>"+(m.name||m.login)+"</div>"+String(m.text||"").replace(/</g,"")+(media);
document.getElementById("log").appendChild(d);
d.scrollIntoView();
}
async function load(){
try{
  var j=await (await fetch(API+"?path=/talk")).json();
  var box=document.getElementById("log"); box.innerHTML="";
  (j.messages||[]).forEach(add);
}catch(e){
  document.getElementById("log").innerHTML="<div class='msg bot'>Чат в облаке ещё не включён. Вставьте код /talk — как /here.</div>";
}
}
function fileToData(file){
return new Promise(function(ok,bad){
  if(!file) return ok(null);
  if(file.size>900000){ alert("Файл больше 900 КБ — сожмите или пришлите ссылку текстом."); return ok(null); }
  var r=new FileReader();
  r.onload=function(){ ok({media:r.result, kind:file.type||"image"}); };
  r.onerror=bad;
  r.readAsDataURL(file);
});
}
async function send(){
var u=user(); if(!u) return;
var text=document.getElementById("q").value.trim();
var f=document.getElementById("file").files[0];
var pack=await fileToData(f);
if(!text && !pack) return;
document.getElementById("q").value="";
document.getElementById("file").value="";
var body={action:"send", login:u.login, name:u.name||u.login, text:text};
if(pack){ body.media=pack.media; body.kind=pack.kind; }
try{
  var r=await fetch(API+"?path=/talk", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if(!r.ok) throw new Error("post");
}catch(e){
  var q="&action=send&login="+encodeURIComponent(u.login)+"&name="+encodeURIComponent(u.name||u.login)+"&text="+encodeURIComponent(text);
  await fetch(API+"?path=/talk"+q);
}
load();
}
document.getElementById("q").addEventListener("keydown", function(e){ if(e.key==="Enter") send(); });
function show(){
document.getElementById("gate").style.display="none";
document.getElementById("app").style.display="flex";
load(); setInterval(load, 5000);
}
if(user()) show();
</script>
<script src="team.js"></script>
</body></html>
