<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Чат · командировки</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<script src="users.js"></script>
<style>
:root{--gold:#e8c989;--ink:#140f0a;--line:rgba(232,201,137,.18)}
*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui,sans-serif;color:#f3e6d0;background:#120e0a}
.bg{position:fixed;inset:0;background:radial-gradient(900px 420px at 10% 0%,#3a2a16,transparent 55%),radial-gradient(700px 380px at 100% 0%,#1b140e,transparent),#120e0a}
.wrap{position:relative;max-width:820px;margin:0 auto;padding:18px 16px 28px;min-height:100vh;display:flex;flex-direction:column}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.nav a,.ghost{color:var(--gold);border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:8px 12px;text-decoration:none;font:inherit;cursor:pointer}
h1{font-family:"Playfair Display",serif;margin:0;font-size:34px}
.sub{color:#cbb896;margin:6px 0 14px}
.panel{border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));padding:14px}
.hat{display:flex;justify-content:space-between;gap:10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#d4b483}
.log{min-height:380px;max-height:58vh;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-top:12px}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap}
.bot{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.me{align-self:flex-end;background:linear-gradient(180deg,#f0d7a6,#c4923a);color:var(--ink)}
.cardx{border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px}
.cardx b{display:block;color:var(--gold);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{cursor:pointer;border:1px solid var(--line);background:transparent;color:#f3e6d0;border-radius:999px;padding:7px 11px;font:inherit}
.bar{display:flex;gap:8px;margin-top:12px}
.bar input{flex:1;border:1px solid var(--line);background:#1a140f;color:#fff;border-radius:14px;padding:13px 14px;font:inherit}
.go{border:0;cursor:pointer;border-radius:14px;padding:13px 16px;font:inherit;font-weight:700;color:var(--ink);background:linear-gradient(180deg,#f0d7a6,#c4923a)}
input.g{width:100%;margin-top:8px;border:1px solid var(--line);background:#1a140f;color:#fff;border-radius:14px;padding:13px 14px;font:inherit}
.err{color:#f3b4b4}
</style></head>
<body>
<div class="bg"></div>
<div id="gate" class="wrap">
<div class="panel" style="max-width:420px;margin:48px auto;width:100%">
<div class="hat">НТЦ Охрана · вход</div>
<h1 style="font-size:28px;margin-top:8px">Чат стола</h1>
<p class="sub">Логин — фамилия. Пароль — 8 цифр даты рождения.</p>
<input class="g" id="login" placeholder="Логин"><input class="g" id="pass" type="password" placeholder="Пароль">
<p class="err" id="err"></p>
<button class="go" type="button" style="margin-top:12px" onclick="enter()">Войти</button>
</div></div>
<div id="app" class="wrap" style="display:none">
<div class="nav">
<a href="index.html">Маршруты</a>
<a href="hotels.html">Гостиницы</a>
<a href="where.html">Кто где</a>
<a href="team.html">Чат охраны</a>
<button class="ghost" type="button" onclick="out()">Выйти</button>
</div>
<div class="hat"><span>ЧАТ · смотрю командировку</span><span id="who"></span></div>
<h1>Стол поездок</h1>
<p class="sub">Диспетчер по командировкам: маршрут по ногам, купе, нижние, гостиница. Не приказ купить билет.</p>
<div class="panel">
<div class="hat">ЭФИР · справка</div>
<div class="log" id="log"></div>
<div class="chips">
<button type="button" onclick="ask('Ижевск — Барнаул')">Ижевск — Барнаул</button>
<button type="button" onclick="ask('купе и нижние')">Купе и нижние</button>
<button type="button" onclick="ask('гостиницы')">Гостиницы</button>
<button type="button" onclick="ask('кто где сегодня')">Кто где</button>
<button type="button" onclick="ask('сапсан и автобус')">Сапсан / автобус</button>
</div>
<div class="bar"><input id="q" placeholder="Спросите как на столе: откуда куда, купе, гостинка"><button class="go" type="button" onclick="send()">Спросить</button></div>
</div>
</div>
<script>
var KEY="mm_user", API="https://functions.yandexcloud.net/d4e5aa975qllld89nvh0";
function norm(s){return String(s||"").trim().toLowerCase().replace(/ё/g,"е");}
function user(){ try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){return null;} }
function enter(){
var l=norm(document.getElementById("login").value), p=String(document.getElementById("pass").value||"").trim();
var u=(window.HOTEL_USERS||[]).find(function(x){return norm(x.login)===l && String(x.pass)===p;});
if(!u){document.getElementById("err").textContent="Неверный логин или пароль"; return;}
localStorage.setItem(KEY, JSON.stringify({login:u.login, admin:!!u.admin, name:u.name||u.login}));
show();
}
function out(){ localStorage.removeItem(KEY); location.reload(); }
function add(html, me){
var d=document.createElement("div"); d.className="msg "+(me?"me":"bot"); d.innerHTML=html; document.getElementById("log").appendChild(d); d.scrollIntoView();
}
function brief(q){
q=norm(q);
if(/ижевск|барнаул|агрыз|новосибир/.test(q))
return "<b>КАРТА МАРШРУТА</b>Ижевск → Барнаул. Прямого поезда часто нет.<div class='cardx'><b>1. Нога</b>Электричка Ижевск → Агрыз</div><div class='cardx'><b>2. Поезд</b>Агрыз → Новосибирск, фильтр купе/нижние</div><div class='cardx'><b>3. Автобус</b>Новосибирск → Барнаул. Меньше пересадок — выше в списке.</div>Откройте главную и поставьте эти города.";
if(/купе|нижн|мест|вагон/.test(q))
return "<b>МЕСТА</b>Фильтры: одно купе · только нижние · одно купе и нижние · любые.";
if(/гостин|отел|дилижан/.test(q))
return "<b>ГОСТИНИЦА</b>Раздел Гостиницы — фильтр по городу. В карточке адрес, телефон, цена и кто сегодня в этой гостинке.";
if(/кто где|отмет|коллег/.test(q))
return "<b>СОСТАВ</b>Общий список — страница Кто где. Чтобы появиться — карточка гостиницы → Я здесь сегодня.";
if(/сапсан|автобус|фильтр рейс/.test(q))
return "<b>РЕЙС</b>Фильтр: сапсан · поезд · автобус · поезд+автобус.";
return "<b>СТОЛ</b>Спросите конкретно: города, купе, сапсан, гостиница, кто где.";
}
function ask(t){ document.getElementById("q").value=t; send(); }
async function send(){
var inp=document.getElementById("q"); var q=inp.value.trim(); if(!q) return;
inp.value=""; add(q.replace(/</g,""), true);
try{
var j=await (await fetch(API+"?path=/chat&q="+encodeURIComponent(q))).json();
if(j && j.text){ add(j.text, false); return; }
}catch(e){}
add(brief(q), false);
}
document.getElementById("q").addEventListener("keydown", function(e){ if(e.key==="Enter") send(); });
function show(){
var u=user(); if(!u) return;
document.getElementById("gate").style.display="none";
document.getElementById("app").style.display="flex";
document.getElementById("who").textContent=u.name;
add("<b>СТОЛ</b>Живая нейросеть подключена. Спрашивайте маршрут, места, гостиницу.", false);
}
if(user()) show();
</script>
<script src="team.js"></script>
</body></html>
