<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Рация</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="users.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui,sans-serif;color:#eef3f8;background:#071018}
.bg{position:fixed;inset:0;background:radial-gradient(900px 420px at 50% 0%,#3a2210,transparent 55%),radial-gradient(700px 380px at 100% 100%,#1c4f7a22,transparent),#071018}
.wrap{position:relative;max-width:560px;margin:0 auto;padding:18px 16px 32px;min-height:100vh;display:flex;flex-direction:column}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.nav a,.btn{color:#f3e0b8;background:rgba(255,255,255,.06);border:1px solid rgba(243,224,184,.18);border-radius:999px;padding:10px 14px;text-decoration:none;font:inherit;cursor:pointer}
h1{margin:0 0 6px;font-size:28px}.lead{color:#b7c6d6;margin:0 0 14px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:16px}
input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:#0b1624;color:#fff;font:inherit;margin-top:8px}
.err{color:#f3b4b4}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.ch b{letter-spacing:.14em;font-size:12px;color:#d4b483;text-transform:uppercase}
.led{width:12px;height:12px;border-radius:50%;background:#2a4;box-shadow:0 0 10px #3c6;flex-shrink:0}
.led.tx{background:#e33;box-shadow:0 0 14px #f44;animation:blink .5s infinite}
.led.rx{background:#e8c989;box-shadow:0 0 14px #e8c989;animation:blink .8s infinite}
@keyframes blink{50%{opacity:.35}}
.ptt-wrap{display:grid;place-items:center;padding:12px 0 8px}
.ptt{width:min(220px,70vw);height:min(220px,70vw);border-radius:50%;border:8px solid rgba(243,224,184,.25);background:radial-gradient(circle at 40% 30%,#f6e2b4,#c8943c 55%,#7a4a18);color:#1a1206;font:800 16px/1.2 Manrope,system-ui;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 8px 16px rgba(255,255,255,.25);user-select:none;-webkit-user-select:none;touch-action:none}
.ptt:active,.ptt.on{transform:scale(.96);background:radial-gradient(circle at 40% 30%,#ff6b6b,#b01010 60%,#4a0000);color:#fff;border-color:#ff8a8a}
.st{text-align:center;min-height:44px;color:#f3e0b8;font-weight:700;margin:8px 0 4px}
.hint{text-align:center;color:#8ea0b3;font-size:13px;margin:0 0 12px}
.log{margin-top:8px;max-height:38vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05)}
.row button{border:0;border-radius:999px;padding:8px 12px;cursor:pointer;font:700 12px Manrope,system-ui;background:#f3e0b8;color:#1a1206}
.row .n{flex:1;font-size:14px}.row .t{font-size:12px;color:#8ea0b3}
.tog{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
</style>
</head>
<body>
<div class="bg"></div>
<div id="gate" class="wrap">
<div class="card" style="max-width:420px;margin:40px auto;width:100%">
<h1>Вход</h1>
<p class="lead">Рация только для сотрудников.</p>
<input id="login" placeholder="Логин" autocomplete="username">
<input id="pass" type="password" placeholder="Пароль" autocomplete="current-password">
<p class="err" id="err"></p>
<button class="btn" type="button" style="margin-top:14px" onclick="enter()">Войти</button>
</div>
</div>
<div id="app" class="wrap" style="display:none">
<div class="nav">
<a href="index.html">Маршруты</a>
<a href="hotels.html">Гостиницы</a>
<a href="where.html">Кто где</a>
<a href="team.html">Чат работников</a>
<button class="btn" type="button" onclick="out()">Выйти</button>
</div>
<h1>Рация</h1>
<p class="lead">Канал охраны. Держите кнопку — говорите. Отпустите — эфир уйдёт всем, кто на этой странице.</p>
<div class="card">
<div class="ch"><b>Общий канал</b><span class="led" id="led"></span></div>
<div class="ptt-wrap">
<button class="ptt" id="ptt" type="button">Говорить</button>
</div>
<p class="st" id="st">Звук выключен — нажмите «Включить эфир»</p>
<p class="hint">Удерживайте кнопку. Не дольше 20 секунд.</p>
<div class="tog">
<button class="btn" type="button" id="snd">Включить эфир</button>
</div>
</div>
<div class="card log" id="log" style="margin-top:12px"></div>
</div>
<script>
var KEY="mm_user", API="https://functions.yandexcloud.net/d4e5aa975qllld89nvh0";
var rec=null, stream=null, chunks=[], talking=false, soundOn=false, lastTs=0, queue=[], busy=false, recTimer=null, recSec=0;
function user(){ try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){return null;} }
function enter(){
  var l=String(document.getElementById("login").value||"").trim().toLowerCase().replace(/ё/g,"е");
  var p=String(document.getElementById("pass").value||"").trim();
  var u=(window.HOTEL_USERS||[]).find(function(x){return String(x.login||"").trim().toLowerCase().replace(/ё/g,"е")===l && String(x.pass)===p;});
  if(!u){document.getElementById("err").textContent="Неверный логин или пароль"; return;}
  localStorage.setItem(KEY, JSON.stringify({login:u.login, admin:!!u.admin, name:u.name||u.login}));
  show();
}
function out(){ localStorage.removeItem(KEY); location.reload(); }
function setLed(mode){
  var el=document.getElementById("led");
  el.className="led"+(mode?" "+mode:"");
}
function setSt(t){ document.getElementById("st").textContent=t; }
function beep(freq, dur){
  try{
    var Ctx=window.AudioContext||window.webkitAudioContext;
    var c=new Ctx();
    var o=c.createOscillator(), g=c.createGain();
    o.frequency.value=freq; o.type="square";
    g.gain.value=0.05; o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+dur);
    setTimeout(function(){c.close();}, (dur+0.05)*1000);
  }catch(e){}
}
function mime(){
  var list=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"];
  if(!window.MediaRecorder) return "";
  for(var i=0;i<list.length;i++) if(MediaRecorder.isTypeSupported(list[i])) return list[i];
  return "";
}
function isRadio(m){
  var k=String(m.kind||"");
  return k.indexOf("radio")>=0 || String(m.text||"") === "рация";
}
function addRow(m, mine){
  var d=document.createElement("div");
  d.className="row";
  var when=m.ts? new Date(m.ts*1000).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"";
  d.innerHTML="<div class='n'><div>"+String(m.name||m.login).replace(/</g,"")+(mine?" · вы":"")+"</div><div class='t'>"+when+"</div></div>";
  if(m.media){
    var b=document.createElement("button");
    b.type="button"; b.textContent="Слушать";
    b.onclick=function(){ playOne(m, true); };
    d.appendChild(b);
  }
  var box=document.getElementById("log");
  box.insertBefore(d, box.firstChild);
}
function playOne(m, manual){
  if(!m || !m.media) return Promise.resolve();
  return new Promise(function(done){
    setLed("rx");
    setSt("Эфир: "+(m.name||m.login));
    if(soundOn || manual) beep(980, 0.07);
    var a=new Audio(m.media);
    a.onended=function(){ if(soundOn||manual) beep(420, 0.09); setLed(""); setSt(soundOn?"На связи. Держите кнопку.":"Эфир выключен"); done(); };
    a.onerror=function(){ setLed(""); done(); };
    var p=a.play();
    if(p && p.catch) p.catch(function(){ done(); });
  });
}
function drain(){
  if(busy || !queue.length) return;
  busy=true;
  var m=queue.shift();
  playOne(m,false).then(function(){ busy=false; drain(); });
}
async function load(first){
  try{
    var j=await (await fetch(API+"?path=/talk")).json();
    var rows=(j.messages||[]).filter(isRadio);
    if(first){
      document.getElementById("log").innerHTML="";
      rows.slice(-12).forEach(function(m){ addRow(m, user() && String(m.login).toLowerCase()===String(user().login).toLowerCase()); });
      lastTs = rows.length? rows[rows.length-1].ts : 0;
      return;
    }
    rows.forEach(function(m){
      if(m.ts<=lastTs) return;
      lastTs=m.ts;
      var mine=user() && String(m.login).toLowerCase()===String(user().login).toLowerCase();
      addRow(m, mine);
      if(!mine && soundOn && m.media){ queue.push(m); drain(); }
    });
  }catch(e){}
}
async function startTalk(ev){
  if(ev) ev.preventDefault();
  if(talking) return;
  var u=user(); if(!u) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setSt("Микрофон в этом браузере недоступен"); return;
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){
    setSt("Нет доступа к микрофону"); return;
  }
  var type=mime();
  chunks=[];
  rec= type? new MediaRecorder(stream,{mimeType:type, audioBitsPerSecond:24000}) : new MediaRecorder(stream);
  rec.ondataavailable=function(e){ if(e.data && e.data.size) chunks.push(e.data); };
  rec.onstop=function(){ finishTalk(); };
  rec.start();
  talking=true;
  recSec=0;
  document.getElementById("ptt").classList.add("on");
  document.getElementById("ptt").textContent="Эфир";
  setLed("tx");
  setSt("Говорите… 0 с");
  if(soundOn) beep(980, 0.07);
  recTimer=setInterval(function(){
    recSec++;
    setSt("Говорите… "+recSec+" с");
    if(recSec>=20) stopTalk();
  },1000);
}
function stopTalk(ev){
  if(ev) ev.preventDefault();
  if(!talking || !rec) return;
  if(recTimer){ clearInterval(recTimer); recTimer=null; }
  talking=false;
  document.getElementById("ptt").classList.remove("on");
  document.getElementById("ptt").textContent="Говорить";
  try{ if(rec.state!=="inactive") rec.stop(); }catch(e){ finishTalk(); }
}
function blobToData(blob){
  return new Promise(function(ok,bad){
    var r=new FileReader();
    r.onload=function(){ ok(r.result); };
    r.onerror=bad;
    r.readAsDataURL(blob);
  });
}
async function finishTalk(){
  if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream=null; }
  setLed("");
  var type=(rec && rec.mimeType) || "audio/webm";
  rec=null;
  if(!chunks.length){ setSt("Пусто — говорите громче"); return; }
  var blob=new Blob(chunks,{type:type});
  chunks=[];
  if(blob.size<400){ setSt("Слишком коротко"); return; }
  if(blob.size>900000){ setSt("Слишком длинно, повторите короче"); return; }
  setSt("Отправка эфира…");
  var data=await blobToData(blob);
  var u=user();
  try{
    var r=await fetch(API+"?path=/talk",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"send",login:u.login,name:u.name||u.login,text:"рация",media:data,kind:"audio/radio"})});
    if(!r.ok) throw new Error("post");
    if(soundOn) beep(420, 0.09);
    setSt("Эфир ушёл");
    load();
  }catch(e){
    setSt("Не отправилось. Проверьте сеть.");
  }
}
function bindPtt(){
  var b=document.getElementById("ptt");
  b.addEventListener("mousedown", startTalk);
  b.addEventListener("mouseup", stopTalk);
  b.addEventListener("mouseleave", function(){ if(talking) stopTalk(); });
  b.addEventListener("touchstart", startTalk, {passive:false});
  b.addEventListener("touchend", stopTalk);
  b.addEventListener("touchcancel", stopTalk);
}
function show(){
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="flex";
  bindPtt();
  load(true);
  setInterval(load, 2000);
  document.getElementById("snd").onclick=function(){
    soundOn=!soundOn;
    this.textContent=soundOn?"Эфир включён":"Включить эфир";
    setSt(soundOn?"На связи. Держите кнопку.":"Эфир выключен");
    if(soundOn) beep(980,0.07);
  };
}
if(user()) show();
</script>
<script src="team.js?v=3"></script>
</body>
</html>
