<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Рация</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="users.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui,sans-serif;color:#eef3f8;background:#071018}
.bg{position:fixed;inset:0;background:radial-gradient(900px 420px at 50% 0%,#3a2210,transparent 55%),#071018}
.wrap{position:relative;max-width:560px;margin:0 auto;padding:16px 16px 12px;min-height:100vh;display:flex;flex-direction:column}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.nav a,.btn{color:#f3e0b8;background:rgba(255,255,255,.06);border:1px solid rgba(243,224,184,.18);border-radius:999px;padding:9px 13px;text-decoration:none;font:inherit;cursor:pointer}
h1{margin:0 0 4px;font-size:26px}.lead{color:#b7c6d6;margin:0 0 10px;font-size:14px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:14px}
input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:#0b1624;color:#fff;font:inherit;margin-top:8px}
.err{color:#f3b4b4}
.feed{flex:1;min-height:240px;max-height:calc(100vh - 340px);overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 10px}
.bubble{display:flex;gap:10px;align-items:center;max-width:92%;padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.06)}
.bubble.me{align-self:flex-end;background:linear-gradient(180deg,rgba(246,226,180,.22),rgba(200,148,60,.14))}
.bubble.missed{outline:1px solid #e8c989}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#c8943c;color:#1a1206;font-weight:800;flex-shrink:0}
.play{width:44px;height:44px;border:0;border-radius:50%;cursor:pointer;background:#f3e0b8;color:#1a1206;font:800 16px Manrope,system-ui;flex-shrink:0}
.meta{flex:1;min-width:0}.meta b{display:block;font-size:14px}.meta span{font-size:12px;color:#8ea0b3}
.miss{font-size:11px;color:#e8c989;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.dock{position:sticky;bottom:0;margin-top:8px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.ch b{letter-spacing:.12em;font-size:11px;color:#d4b483;text-transform:uppercase}
.led{width:10px;height:10px;border-radius:50%;background:#2a4;box-shadow:0 0 8px #3c6}
.led.tx{background:#e33;box-shadow:0 0 12px #f44;animation:blink .5s infinite}
.led.rx{background:#e8c989;box-shadow:0 0 12px #e8c989;animation:blink .8s infinite}
@keyframes blink{50%{opacity:.35}}
.ptt-wrap{display:grid;place-items:center}
.ptt{width:132px;height:132px;border-radius:50%;border:7px solid rgba(243,224,184,.25);background:radial-gradient(circle at 40% 30%,#f6e2b4,#c8943c 55%,#7a4a18);color:#1a1206;font:800 13px/1.15 Manrope,system-ui;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;box-shadow:0 12px 28px rgba(0,0,0,.4);user-select:none;-webkit-user-select:none;touch-action:none}
.ptt:active,.ptt.on{transform:scale(.96);background:radial-gradient(circle at 40% 30%,#ff6b6b,#b01010 60%,#4a0000);color:#fff}
.st{text-align:center;color:#f3e0b8;font-weight:700;margin:8px 0 0;min-height:22px;font-size:14px}
.tog{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.empty{color:#8ea0b3;text-align:center;padding:24px 8px}
</style>
</head>
<body>
<div class="bg"></div>
<div id="gate" class="wrap">
<div class="card" style="max-width:420px;margin:40px auto;width:100%">
<h1>Вход</h1>
<p class="lead">Рация только для сотрудников.</p>
<input id="login" placeholder="Логин" autocomplete="username">
<input id="pass" type="password" placeholder="Пароль" autocomplete="current-password">
<p class="err" id="err"></p>
<button class="btn" type="button" style="margin-top:14px" onclick="enter()">Войти</button>
</div>
</div>
<div id="app" class="wrap" style="display:none">
<div class="nav">
<a href="index.html">Маршруты</a>
<a href="hotels.html">Гостиницы</a>
<span class="nav-lab">Для работников</span>
<a href="where.html">Кто где</a>
<a href="team.html">Чат работников</a>
<a href="radio.html">Рация</a>
<a href="naryad.html">Наряд</a>
<button class="btn" type="button" onclick="out()">Выйти</button>
</div>
<h1>Рация</h1>
<p class="lead">Как Hello: сказал — запись остаётся. Пропустил эфир — нажми «слушать».</p>
<div class="feed" id="log"><div class="empty">Пока тихо. Держите кнопку и скажите.</div></div>
<div class="card dock">
<div class="ch"><b>Общий канал</b><span class="led" id="led"></span></div>
<div class="ptt-wrap"><button class="ptt" id="ptt" type="button">Говорить</button></div>
<p class="st" id="st">Включите эфир, чтобы слышать сразу</p>
<div class="tog">
<button class="btn" type="button" id="snd">Включить эфир</button>
<button class="btn" type="button" id="missed">Прослушать пропущенные</button>
</div>
</div>
</div>
<script>
var KEY="mm_user", API="https://functions.yandexcloud.net/d4e5aa975qllld89nvh0";
var rec=null, stream=null, chunks=[], talking=false, soundOn=false, lastTs=0, queue=[], busy=false, recTimer=null, recSec=0, shown={};
function user(){ try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){return null;} }
function enter(){
  var l=String(document.getElementById("login").value||"").trim().toLowerCase().replace(/ё/g,"е");
  var p=String(document.getElementById("pass").value||"").trim();
  var u=(window.HOTEL_USERS||[]).find(function(x){return String(x.login||"").trim().toLowerCase().replace(/ё/g,"е")===l && String(x.pass)===p;});
  if(!u){document.getElementById("err").textContent="Неверный логин или пароль"; return;}
  localStorage.setItem(KEY, JSON.stringify({login:u.login, admin:!!u.admin, name:u.name||u.login}));
  show();
}
function out(){ localStorage.removeItem(KEY); location.reload(); }
function hkey(){ return "radio_heard_"+(user()&&user().login||""); }
function heard(){ try{return JSON.parse(localStorage.getItem(hkey())||"{}");}catch(e){return {};} }
function markHeard(ts){ var m=heard(); m[String(ts)]=1; localStorage.setItem(hkey(), JSON.stringify(m)); }
function wasHeard(ts){ return !!heard()[String(ts)]; }
function setLed(mode){ document.getElementById("led").className="led"+(mode?" "+mode:""); }
function setSt(t){ document.getElementById("st").textContent=t; }
function beep(freq, dur){
  try{
    var Ctx=window.AudioContext||window.webkitAudioContext, c=new Ctx();
    var o=c.createOscillator(), g=c.createGain();
    o.frequency.value=freq; o.type="square"; g.gain.value=0.05;
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur);
    setTimeout(function(){c.close();}, (dur+0.05)*1000);
  }catch(e){}
}
function mime(){
  var list=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"];
  if(!window.MediaRecorder) return "";
  for(var i=0;i<list.length;i++) if(MediaRecorder.isTypeSupported(list[i])) return list[i];
  return "";
}
function isRadio(m){ var k=String(m.kind||""); return k.indexOf("radio")>=0 || String(m.text||"")==="рация"; }
function mineOf(m){ var u=user(); return u && String(m.login||"").toLowerCase()===String(u.login).toLowerCase(); }
function addRow(m){
  var id=String(m.ts||"")+"_"+String(m.login||"");
  if(shown[id]) return;
  shown[id]=1;
  var box=document.getElementById("log");
  var empty=box.querySelector(".empty"); if(empty) empty.remove();
  var mine=mineOf(m);
  if(mine) markHeard(m.ts);
  var missed=!mine && !wasHeard(m.ts);
  var d=document.createElement("div");
  d.className="bubble"+(mine?" me":"")+(missed?" missed":"");
  d.dataset.ts=m.ts;
  var when=m.ts? new Date(m.ts*1000).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
  var sec=m.sec? (" · "+m.sec+" с"):"";
  var name=String(m.name||m.login||"?").replace(/</g,"");
  var init=(name.charAt(0)||"?").toUpperCase();
  d.innerHTML="<div class='av'>"+init+"</div><div class='meta'><b>"+name+(mine?" · вы":"")+"</b><span>"+when+sec+"</span>"+(missed?"<div class='miss'>пропущено</div>":"")+"</div>";
  if(m.media){
    var b=document.createElement("button");
    b.type="button"; b.className="play"; b.textContent="▶";
    b.onclick=function(){ playOne(m,true,d); };
    d.appendChild(b);
  }
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
}
function playOne(m, manual, el){
  if(!m || !m.media) return Promise.resolve();
  return new Promise(function(done){
    setLed("rx");
    setSt("Эфир: "+(m.name||m.login));
    if(soundOn || manual) beep(980, 0.07);
    var a=new Audio(m.media);
    a.onended=function(){
      markHeard(m.ts);
      if(el){ el.classList.remove("missed"); var x=el.querySelector(".miss"); if(x) x.remove(); }
      if(soundOn||manual) beep(420, 0.09);
      setLed(""); setSt(soundOn?"На связи":"Запись сохранена — можно слушать позже");
      done();
    };
    a.onerror=function(){ setLed(""); done(); };
    var p=a.play();
    if(p && p.catch) p.catch(function(){ done(); });
  });
}
function drain(){
  if(busy || !queue.length) return;
  busy=true;
  var m=queue.shift();
  var el=document.querySelector('.bubble[data-ts="'+m.ts+'"]');
  playOne(m,false,el).then(function(){ busy=false; drain(); });
}
async function fetchRows(){
  try{
    var r=await fetch(API+"?path=/radio");
    var j=await r.json();
    if(j && j.ok && j.messages) return j.messages;
  }catch(e){}
  try{
    var t=await (await fetch(API+"?path=/talk")).json();
    return (t.messages||[]).filter(isRadio);
  }catch(e){ return []; }
}
async function load(first){
  var rows=await fetchRows();
  if(first){
    shown={};
    document.getElementById("log").innerHTML="";
    rows.forEach(addRow);
    lastTs = rows.length? rows[rows.length-1].ts : 0;
    if(!rows.length) document.getElementById("log").innerHTML="<div class='empty'>Пока тихо. Держите кнопку и скажите.</div>";
    return;
  }
  rows.forEach(function(m){
    var id=String(m.ts||"")+"_"+String(m.login||"");
    if(shown[id]){ if(m.ts>lastTs) lastTs=m.ts; return; }
    if(mineOf(m) && lastTs && Math.abs((m.ts||0)-lastTs)<6){
      shown[id]=1;
      if(m.ts>lastTs) lastTs=m.ts;
      return;
    }
    if(m.ts>lastTs) lastTs=m.ts;
    addRow(m);
    if(!mineOf(m) && soundOn && m.media && !wasHeard(m.ts)){ queue.push(m); drain(); }
  });
}
function playMissed(){
  soundOn=true;
  document.getElementById("snd").textContent="Эфир включён";
  var rows=[].slice.call(document.querySelectorAll(".bubble.missed"));
  if(!rows.length){ setSt("Пропущенных нет"); return; }
  rows.forEach(function(){});
  fetchRows().then(function(all){
    all.forEach(function(m){
      if(!mineOf(m) && !wasHeard(m.ts) && m.media) queue.push(m);
    });
    drain();
  });
}
async function startTalk(ev){
  if(ev) ev.preventDefault();
  if(talking) return;
  var u=user(); if(!u) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setSt("Микрофон в этом браузере недоступен"); return;
  }
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ setSt("Нет доступа к микрофону"); return; }
  var type=mime();
  chunks=[];
  rec= type? new MediaRecorder(stream,{mimeType:type, audioBitsPerSecond:24000}) : new MediaRecorder(stream);
  rec.ondataavailable=function(e){ if(e.data && e.data.size) chunks.push(e.data); };
  rec.onstop=function(){ finishTalk(); };
  rec.start();
  talking=true; recSec=0;
  document.getElementById("ptt").classList.add("on");
  document.getElementById("ptt").textContent="Эфир";
  setLed("tx"); setSt("Говорите… 0 с");
  if(soundOn) beep(980, 0.07);
  recTimer=setInterval(function(){
    recSec++; setSt("Говорите… "+recSec+" с");
    if(recSec>=20) stopTalk();
  },1000);
}
function stopTalk(ev){
  if(ev) ev.preventDefault();
  if(!talking || !rec) return;
  if(recTimer){ clearInterval(recTimer); recTimer=null; }
  talking=false;
  document.getElementById("ptt").classList.remove("on");
  document.getElementById("ptt").textContent="Говорить";
  try{ if(rec.state!=="inactive") rec.stop(); }catch(e){ finishTalk(); }
}
function blobToData(blob){
  return new Promise(function(ok,bad){
    var r=new FileReader(); r.onload=function(){ ok(r.result); }; r.onerror=bad; r.readAsDataURL(blob);
  });
}
async function finishTalk(){
  if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream=null; }
  setLed("");
  var type=(rec && rec.mimeType) || "audio/webm";
  rec=null;
  if(!chunks.length){ setSt("Пусто — говорите громче"); return; }
  var blob=new Blob(chunks,{type:type});
  chunks=[];
  if(blob.size<400){ setSt("Слишком коротко"); return; }
  if(blob.size>900000){ setSt("Слишком длинно, повторите короче"); return; }
  setSt("Отправка…");
  var data=await blobToData(blob);
  var u=user();
  var body={action:"send",login:u.login,name:u.name||u.login,text:"рация",media:data,kind:"audio/radio",sec:recSec};
  try{
    var r=await fetch(API+"?path=/radio",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok) throw new Error("radio");
  }catch(e){
    try{
      var r2=await fetch(API+"?path=/talk",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      if(!r2.ok) throw new Error("talk");
    }catch(e2){ setSt("Не отправилось. Проверьте сеть."); return; }
  }
  try{ fetch(API+"?path=/talk",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); }catch(e){}
  addRow({login:u.login,name:u.name||u.login,media:data,kind:"audio/radio",sec:recSec,ts:Math.floor(Date.now()/1000)});
  lastTs=Math.floor(Date.now()/1000);
  if(soundOn) beep(420, 0.09);
  setSt("Сохранено. Можно прослушать позже.");
}
function bindPtt(){
  var b=document.getElementById("ptt");
  b.addEventListener("mousedown", startTalk);
  b.addEventListener("mouseup", stopTalk);
  b.addEventListener("mouseleave", function(){ if(talking) stopTalk(); });
  b.addEventListener("touchstart", startTalk, {passive:false});
  b.addEventListener("touchend", stopTalk);
  b.addEventListener("touchcancel", stopTalk);
}
function show(){
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="flex";
  bindPtt();
  load(true);
  setInterval(load, 2500);
  document.getElementById("snd").onclick=function(){
    soundOn=!soundOn;
    this.textContent=soundOn?"Эфир включён":"Включить эфир";
    setSt(soundOn?"На связи. Новые сразу играются, старые остаются.":"Эфир выключен. Записи в ленте.");
    if(soundOn) beep(980,0.07);
  };
  document.getElementById("missed").onclick=playMissed;
}
if(user()) show();
</script>
<script src="staff-nav.js"></script>
<script src="team.js?v=3"></script>
</body>
</html>
