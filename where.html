<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Кто где</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="users.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui,sans-serif;color:#eef3f8;background:#071018}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(1000px 500px at 0% 0%,#1c4f7a,transparent 55%),radial-gradient(800px 400px at 100% 0%,#7a4a18,transparent 50%),#071018}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:28px 18px 64px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.nav a,.btn{color:#f3e0b8;background:rgba(255,255,255,.06);border:1px solid rgba(243,224,184,.18);border-radius:999px;padding:10px 14px;text-decoration:none;font:inherit;cursor:pointer}
h1{margin:0 0 8px;font-size:32px}.lead{color:#b7c6d6}
.card{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:16px;margin-top:12px}
input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:#0b1624;color:#fff;font:inherit;margin-top:8px}
.err{color:#f3b4b4}.row{margin-top:8px}.muted{color:#8ea0b3}
</style></head>
<body>
<div class="bg"></div>
<div id="gate" class="wrap">
<div class="card" style="max-width:420px;margin:40px auto;width:100%">
<h1 style="font-size:28px">Вход</h1>
<p class="lead">Логин — фамилия. Пароль — 8 цифр даты рождения.</p>
<input id="login" placeholder="Логин"><input id="pass" type="password" placeholder="Пароль">
<p class="err" id="err"></p>
<button class="btn" type="button" style="margin-top:14px" onclick="enter()">Войти</button>
</div></div>
<div id="app" class="wrap" style="display:none">
<div class="nav">
<a href="index.html">Маршруты</a>
<a href="hotels.html">Гостиницы</a>
<a href="chat.html">ИИ помощник</a>
<a href="team.html">Чат работников</a>
<button class="btn" type="button" onclick="out()">Выйти</button>
</div>
<h1>Кто где сегодня</h1>
<p class="lead" id="sum"></p>
<div class="card" id="on"></div>
<div class="card" id="off"></div>
</div>
<script>
var KEY="mm_user", API="https://functions.yandexcloud.net/d4e5aa975qllld89nvh0";
function norm(s){return String(s||"").trim().toLowerCase().replace(/ё/g,"е");}
function user(){ try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){return null;} }
function enter(){
var l=norm(document.getElementById("login").value), p=String(document.getElementById("pass").value||"").trim();
var u=(window.HOTEL_USERS||[]).find(function(x){return norm(x.login)===l && String(x.pass)===p;});
if(!u){document.getElementById("err").textContent="Неверный логин или пароль"; return;}
localStorage.setItem(KEY, JSON.stringify({login:u.login, admin:!!u.admin, name:u.name||u.login}));
show();
}
function out(){ localStorage.removeItem(KEY); location.reload(); }
async function show(){
document.getElementById("gate").style.display="none";
document.getElementById("app").style.display="block";
var by={};
try{var j=await (await fetch(API+"?path=/here")).json(); (j.people||[]).forEach(function(p){by[norm(p.login)]=p;});}catch(e){}
var on=[], off=[];
(window.HOTEL_USERS||[]).forEach(function(u){
var p=by[norm(u.login)];
if(p&&p.hotel) on.push("<div class='row'><b>"+(u.name||u.login)+"</b> — "+p.hotel+(p.city?(" · "+p.city):"")+"</div>");
else off.push("<div class='row muted'><b>"+(u.name||u.login)+"</b> — не отметился</div>");
});
document.getElementById("sum").textContent="На местах "+on.length+" · не отметились "+off.length;
document.getElementById("on").innerHTML="<b>На местах</b>"+(on.join("")||"<div class='row muted'>Пока никто не отметился</div>");
document.getElementById("off").innerHTML="<b>Не отметились</b>"+off.join("");
}
if(user()) show();
</script>
<script src="team.js?v=2"></script>
</body></html>
