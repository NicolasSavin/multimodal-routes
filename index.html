<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>МультиМаршрут — поезда и автобусы</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>tailwind.config={theme:{extend:{colors:{rzd:{red:'#E31E24'}}}}}</script>
  <style>
    body{font-family:Inter,system-ui,sans-serif}
    .gradient-bg{background:linear-gradient(135deg,#1a1a2e,#0f3460)}
    .autocomplete-item:hover{background:#fee2e2}
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="gradient-bg text-white sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center gap-3">
      <div class="bg-rzd-red p-2 rounded-xl"><i class="fas fa-train"></i></div>
      <div>
        <h1 class="text-xl font-bold">МультиМаршрут</h1>
        <p class="text-xs text-blue-200">Поезда + автобусы · схема мест</p>
      </div>
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-4 py-8">
    <form id="searchForm" class="bg-white rounded-2xl shadow p-6 mb-8 space-y-4">
      <div class="grid md:grid-cols-2 gap-4">
        <div class="relative">
          <label class="text-sm font-medium">Откуда</label>
          <input id="fromCity" class="w-full mt-1 px-3 py-3 border rounded-xl" placeholder="Агрыз, Ижевск, Москва..." required autocomplete="off" />
          <div id="fromSuggestions" class="absolute z-20 w-full bg-white border rounded-xl mt-1 hidden max-h-56 overflow-y-auto"></div>
        </div>
        <div class="relative">
          <label class="text-sm font-medium">Куда</label>
          <input id="toCity" class="w-full mt-1 px-3 py-3 border rounded-xl" placeholder="Барнаул, Казань..." required autocomplete="off" />
          <div id="toSuggestions" class="absolute z-20 w-full bg-white border rounded-xl mt-1 hidden max-h-56 overflow-y-auto"></div>
        </div>
      </div>
      <div class="grid sm:grid-cols-3 gap-4">
        <div><label class="text-sm">Дата</label><input type="date" id="departDate" class="w-full mt-1 px-3 py-3 border rounded-xl" required /></div>
        <div>
          <label class="text-sm">Пассажиры</label>
          <select id="passengers" class="w-full mt-1 px-3 py-3 border rounded-xl">
            <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
          </select>
        </div>
        <div>
          <label class="text-sm">Тип</label>
          <select id="transportMode" class="w-full mt-1 px-3 py-3 border rounded-xl">
            <option value="all">Все</option>
            <option value="train">Поезда</option>
            <option value="bus">Автобусы</option>
            <option value="multi">Мульти</option>
          </select>
        </div>
      </div>
      <div class="flex flex-wrap gap-4 text-sm bg-red-50 p-3 rounded-xl">
        <label class="flex items-center gap-2"><input type="checkbox" id="sameCompartment" /> Одно купе</label>
        <label class="flex items-center gap-2"><input type="checkbox" id="lowerBerths" /> Только нижние</label>
      </div>
      <button class="px-6 py-3 bg-rzd-red text-white rounded-xl font-semibold">Найти</button>
    </form>
    <div id="loading" class="hidden text-center py-10 text-gray-500">Ищем маршруты...</div>
    <section id="results" class="hidden">
      <div class="flex justify-between mb-3"><h2 class="font-bold">Маршруты</h2><span id="resultsCount" class="text-sm text-gray-500"></span></div>
      <div id="routesList" class="space-y-4"></div>
    </section>
    <section id="emptyState" class="text-center text-gray-500 py-10">Укажите города и нажмите «Найти»</section>
  </main>
  <div id="seatModal" class="hidden fixed inset-0 z-[80] bg-black/50 flex items-end sm:items-center justify-center p-4">
    <div class="bg-white w-full sm:max-w-2xl rounded-2xl max-h-[92vh] overflow-y-auto">
      <div class="sticky top-0 bg-white border-b px-5 py-3 flex justify-between">
        <div><h3 id="modalTitle" class="font-bold">Схема мест</h3><p id="modalSub" class="text-sm text-gray-500"></p></div>
        <button id="modalClose" type="button" class="text-2xl leading-none">&times;</button>
      </div>
      <div class="p-5 space-y-3">
        <div id="modalInfo" class="text-sm bg-gray-50 rounded-xl p-3"></div>
        <div id="modalScheme"></div>
        <p class="text-xs text-gray-500">Нечётные номера — нижние полки, чётные — верхние. Купе = 4 места.</p>
      </div>
    </div>
  </div>
  <script src="cities.js"></script>
  <script src="app.js"></script>
</body>
</html>
