<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>МультиМаршрут v5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{rzd:{red:'#E31E24'}}}}}</script>
  <style>
    body{font-family:system-ui,sans-serif}
    .gradient-bg{background:linear-gradient(135deg,#1a1a2e,#0f3460)}
    #seatModal[hidden]{display:none!important}
    #seatModal{display:flex}
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="gradient-bg text-white sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4">
      <h1 class="text-xl font-bold">МультиМаршрут v5</h1>
      <p class="text-xs text-blue-200">Если не видишь v5 — это старый кэш</p>
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-4 py-8">
    <form id="searchForm" class="bg-white rounded-2xl shadow p-6 mb-8 space-y-4">
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="text-sm font-medium">Откуда</label>
          <input id="fromCity" class="w-full mt-1 px-3 py-3 border rounded-xl" placeholder="Агрыз" required />
        </div>
        <div>
          <label class="text-sm font-medium">Куда</label>
          <input id="toCity" class="w-full mt-1 px-3 py-3 border rounded-xl" placeholder="Барнаул" required />
        </div>
      </div>
      <div class="grid sm:grid-cols-3 gap-4">
        <div><label class="text-sm">Дата</label><input type="date" id="departDate" class="w-full mt-1 px-3 py-3 border rounded-xl" required /></div>
        <div>
          <label class="text-sm">Пассажиры</label>
          <select id="passengers" class="w-full mt-1 px-3 py-3 border rounded-xl">
            <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
          </select>
        </div>
        <div>
          <label class="text-sm">Тип</label>
          <select id="transportMode" class="w-full mt-1 px-3 py-3 border rounded-xl">
            <option value="all">Все</option>
            <option value="train">Поезда</option>
            <option value="bus">Автобусы</option>
          </select>
        </div>
      </div>
      <div class="flex gap-4 text-sm bg-red-50 p-3 rounded-xl">
        <label><input type="checkbox" id="sameCompartment" /> Одно купе</label>
        <label><input type="checkbox" id="lowerBerths" /> Только нижние</label>
      </div>
      <button type="submit" class="px-6 py-3 bg-rzd-red text-white rounded-xl font-semibold">Найти</button>
    </form>
    <div id="routesList" class="space-y-4"></div>
  </main>
  <div id="seatModal" hidden class="fixed inset-0 z-[90] bg-black/60 items-center justify-center p-4">
    <div class="bg-white w-full max-w-2xl rounded-2xl max-h-[90vh] overflow-y-auto p-5">
      <div class="flex justify-between items-start mb-3">
        <div>
          <h3 id="modalTitle" class="font-bold text-lg">Схема мест</h3>
          <p id="modalSub" class="text-sm text-gray-500"></p>
        </div>
        <button type="button" id="modalClose" style="font-size:28px;line-height:1">&times;</button>
      </div>
      <div id="modalInfo" class="text-sm bg-gray-50 rounded-xl p-3 mb-3"></div>
      <div id="modalScheme"></div>
    </div>
  </div>
<script>
(function () {
  var ROUTES = [];
  var d = document.getElementById("departDate");
  try {
    var t = new Date(); t.setDate(t.getDate() + 1);
    d.value = t.toISOString().slice(0, 10);
  } catch (e) {}
  function isLower(n) { return n % 2 === 1; }
  function makeRoutes(from, to, pax) {
    return [
      { id: "train", type: "train", title: "Поезд дальнего следования", dur: "~13ч", segs: from + " 19:30 → " + to + " 08:45+1", price: "2 500–7 200 ₽", lower: true, coupe: true, pax: pax },
      { id: "bus", type: "bus", title: "Прямой автобус", dur: "~12ч", segs: from + " 08:00 → " + to + " 20:00", price: "1 800–3 600 ₽", lower: false, coupe: false, pax: pax },
      { id: "multi", type: "multi", title: "Поезд + автобус", dur: "~16ч", segs: from + " → хаб → " + to, price: "2 800–5 200 ₽", lower: true, coupe: false, pax: pax }
    ];
  }
  function schemeHtml(r) {
    var pax = r.pax || 1;
    var wantLower = document.getElementById("lowerBerths").checked;
    var wantSame = document.getElementById("sameCompartment").checked && pax >= 2;
    var assigned = [];
    var html = "";
    var c, n, i, seats, on;
    if (r.coupe) {
      for (c = 1; c <= 9 && assigned.length < pax; c++) {
        seats = wantLower ? [c*4-3, c*4-1] : [c*4-3, c*4-1, c*4-2, c*4];
        for (i = 0; i < seats.length; i++) {
          if (assigned.length < pax) assigned.push({ n: seats[i], coupe: c, low: isLower(seats[i]) });
        }
        if (wantSame) break;
      }
      html += "<div class='bg-green-50 border border-green-200 rounded-xl p-3 text-sm mb-3'><b>Места:</b><br>";
      for (i = 0; i < assigned.length; i++) {
        html += "№" + assigned[i].n + " — " + (assigned[i].low ? "нижняя" : "верхняя") + " · купе " + assigned[i].coupe + "<br>";
      }
      html += "</div><div class='grid grid-cols-3 gap-2'>";
      for (c = 1; c <= 9; c++) {
        seats = [c*4-3, c*4-2, c*4-1, c*4];
        html += "<div class='border rounded-xl p-2'><div class='text-xs text-gray-500'>Купе " + c + "</div><div class='grid grid-cols-2 gap-1 text-xs mt-1'>";
        for (i = 0; i < seats.length; i++) {
          n = seats[i];
          on = assigned.some(function (a) { return a.n === n; });
          html += "<div class='px-1 py-1 rounded text-center " + (on ? "bg-red-600 text-white" : (isLower(n) ? "bg-green-100" : "bg-gray-100")) + "'>" + n + (isLower(n) ? "↓" : "↑") + "</div>";
        }
        html += "</div></div>";
      }
      html += "</div>";
    } else if (r.lower) {
      html += "<p class='text-sm mb-2'>Плацкарт, нечётные = нижние</p>";
      for (n = 1; n <= 12; n++) {
        if (assigned.length < pax && (!wantLower || isLower(n))) assigned.push({ n: n, low: isLower(n) });
      }
      html += "<div class='bg-green-50 rounded-xl p-3 text-sm mb-3'><b>Места:</b> " + assigned.map(function (a) { return "№" + a.n + (a.low ? " низ" : " верх"); }).join(", ") + "</div>";
      html += "<div class='grid grid-cols-4 gap-2 text-xs'>";
      for (n = 1; n <= 36; n++) {
        on = assigned.some(function (a) { return a.n === n; });
        html += "<div class='p-2 rounded text-center " + (on ? "bg-red-600 text-white" : (isLower(n) ? "bg-green-100" : "bg-gray-100")) + "'>" + n + "</div>";
      }
      html += "</div>";
    } else {
      html += "<p class='text-sm mb-2'>Сидячие места (автобус)</p><div class='grid grid-cols-4 gap-2 text-xs'>";
      for (n = 1; n <= 16; n++) {
        html += "<div class='p-2 rounded text-center " + (n <= pax ? "bg-red-600 text-white" : "bg-gray-100") + "'>" + n + "</div>";
      }
      html += "</div>";
    }
    return html;
  }
  window.openSeat = function (id, mode) {
    var r = null;
    for (var i = 0; i < ROUTES.length; i++) if (ROUTES[i].id === id) r = ROUTES[i];
    if (!r) { alert("Маршрут не найден"); return; }
    document.getElementById("modalTitle").textContent = mode === "select" ? "Выбранный вариант" : "Схема мест";
    document.getElementById("modalSub").textContent = r.title + " · " + r.dur;
    document.getElementById("modalInfo").textContent = (r.coupe ? "Можно одно купе. " : "") + (r.lower ? "Нижние — нечётные номера." : "Купе нет.");
    document.getElementById("modalScheme").innerHTML = schemeHtml(r);
    var m = document.getElementById("seatModal");
    m.hidden = false;
    m.style.display = "flex";
  };
  window.closeSeat = function () {
    var m = document.getElementById("seatModal");
    m.hidden = true;
    m.style.display = "none";
  };
  document.getElementById("modalClose").onclick = window.closeSeat;
  document.getElementById("seatModal").onclick = function (e) {
    if (e.target.id === "seatModal") window.closeSeat();
  };
  document.getElementById("searchForm").onsubmit = function (e) {
    e.preventDefault();
    var from = document.getElementById("fromCity").value.trim();
    var to = document.getElementById("toCity").value.trim();
    var pax = parseInt(document.getElementById("passengers").value, 10);
    var mode = document.getElementById("transportMode").value;
    var same = document.getElementById("sameCompartment").checked;
    var low = document.getElementById("lowerBerths").checked;
    ROUTES = makeRoutes(from, to, pax);
    if (mode === "train") ROUTES = ROUTES.filter(function (r) { return r.type === "train"; });
    if (mode === "bus") ROUTES = ROUTES.filter(function (r) { return r.type === "bus"; });
    if (low) ROUTES = ROUTES.filter(function (r) { return r.lower; });
    if (same && pax >= 2) ROUTES = ROUTES.filter(function (r) { return r.coupe; });
    var box = document.getElementById("routesList");
    if (!ROUTES.length) {
      box.innerHTML = "<div class='bg-yellow-50 border rounded-xl p-4'>Ничего нет по фильтрам</div>";
      return false;
    }
    box.innerHTML = ROUTES.map(function (r) {
      return "<article class='bg-white border rounded-2xl p-5'>" +
        "<div class='flex justify-between mb-2'><div><h3 class='font-bold'>" + r.title + "</h3>" +
        "<p class='text-sm text-gray-500'>" + r.dur + "</p></div><div class='font-bold'>" + r.price + "</div></div>" +
        "<p class='text-sm mb-3'>" + r.segs + "</p>" +
        "<button type='button' onclick=\"openSeat('" + r.id + "','select')\" class='px-4 py-2 bg-rzd-red text-white rounded-lg text-sm mr-2'>Выбрать</button>" +
        "<button type='button' onclick=\"openSeat('" + r.id + "','details')\" class='px-4 py-2 border rounded-lg text-sm'>Подробнее / схема мест</button>" +
        "</article>";
    }).join("");
    return false;
  };
})();
</script>
</body>
</html>
