<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-store"/>
<title>Командировки v6</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{rzd:{red:'#E31E24'}}}}}</script>
<style>body{font-family:system-ui,sans-serif}.top{background:linear-gradient(135deg,#12203a,#1b3a5f)}#seatModal[hidden]{display:none!important}#seatModal{display:flex}</style>
</head>
<body class="bg-slate-50 min-h-screen">
<header class="top text-white sticky top-0 z-40"><div class="max-w-5xl mx-auto px-4 py-4">
<h1 class="text-xl font-bold">Маршруты для командировок · v6</h1>
<p class="text-xs text-blue-200">Куда сесть, где выйти, как пересесть на автобус</p>
</div></header>
<main class="max-w-5xl mx-auto px-4 py-6">
<form id="searchForm" class="bg-white rounded-2xl shadow p-5 mb-6 space-y-3">
<div class="grid md:grid-cols-2 gap-3">
<div><label class="text-sm font-medium">Откуда</label><input id="fromCity" class="w-full mt-1 px-3 py-3 border rounded-xl" required placeholder="Агрыз, Ижевск"/></div>
<div><label class="text-sm font-medium">Куда (командировка)</label><input id="toCity" class="w-full mt-1 px-3 py-3 border rounded-xl" required placeholder="Барнаул, Бийск"/></div>
</div>
<div class="grid sm:grid-cols-3 gap-3">
<div><label class="text-sm">Дата</label><input type="date" id="departDate" class="w-full mt-1 px-3 py-3 border rounded-xl" required/></div>
<div><label class="text-sm">Сотрудников</label><select id="passengers" class="w-full mt-1 px-3 py-3 border rounded-xl"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
<div><label class="text-sm">Показать</label><select id="transportMode" class="w-full mt-1 px-3 py-3 border rounded-xl"><option value="all">Все</option><option value="train">Поезда</option><option value="bus">Автобусы</option><option value="multi">С пересадкой</option></select></div>
</div>
<div class="flex gap-4 text-sm bg-red-50 p-3 rounded-xl"><label><input type="checkbox" id="sameCompartment"/> Одно купе</label><label><input type="checkbox" id="lowerBerths"/> Нижние</label></div>
<button class="px-6 py-3 bg-rzd-red text-white rounded-xl font-semibold">Показать маршруты</button>
</form>
<div id="routesList" class="space-y-4"></div>
</main>
<div id="seatModal" hidden class="fixed inset-0 z-[90] bg-black/60 items-center justify-center p-4"><div class="bg-white w-full max-w-2xl rounded-2xl max-h-[90vh] overflow-y-auto p-5">
<div class="flex justify-between"><div><h3 id="modalTitle" class="font-bold"></h3><p id="modalSub" class="text-sm text-gray-500"></p></div><button type="button" id="modalClose" style="font-size:28px">&times;</button></div>
<div id="modalInfo" class="text-sm bg-gray-50 rounded-xl p-3 my-3"></div><div id="modalScheme"></div>
</div></div>
<script>
(function(){
var ROUTES=[];
try{var t=new Date();t.setDate(t.getDate()+1);document.getElementById("departDate").value=t.toISOString().slice(0,10);}catch(e){}
var HUBS={
"Москва":{train:"Вокзал из билета (Казанский / Ярославский / Ленинградский / Курский)",bus:"Щёлковский, Южные ворота или автостанция у вокзала",how:"Между вокзалами — метро 15–40 мин. Казанский↔Ярославский/Ленинградский: 8–12 мин пешко (Комсомольская). На автовокзал — метро + 10–20 мин или такси. Стыковка не короче 3 часов."},
"Казань":{train:"Казань-Пассажирская",bus:"Автовокзал Центральный или Южный",how:"От ж/д до Центрального автовокзала 15–25 мин. Не путать с Казань-2."},
"Екатеринбург":{train:"Екатеринбург-Пассажирский",bus:"Северный автовокзал у вокзала",how:"Северный АВ — 5–10 мин пешко от ж/д. Южный — 25–40 мин."},
"Новосибирск":{train:"Новосибирск-Главный",bus:"Автовокзал / площадка у вокзала",how:"До автовокзала 10–20 мин. На Алтай часть автобусов уходит от привокзальной — смотрите табло."},
"Барнаул":{train:"Ж/д вокзал Барнаул",bus:"Автовокзал Барнаул",how:"Автовокзал в 10–20 мин езды от ж/д, такси 150–300 ₽. Не выходите на Барнаул-Южный, если в билете просто «Барнаул»."},
"Ижевск":{train:"Ижевск, ул. Дружбы",bus:"Центральный автовокзал",how:"От ж/д до Центрального АВ 10–15 мин."},
"Пермь":{train:"Пермь-2",bus:"Автовокзал у Пермь-2",how:"5–10 мин пешко. Не путать с Пермь-1."}
};
function pickHub(from,to){
var s=(from+" "+to).toLowerCase();
if(/ барнаул|бийск|алтай|горно/.test(s)) return {name:"Новосибирск",info:HUBS["Новосибирск"]};
if(/агрыз|ижевск|глазов|воткинск|сарапул/.test(s)) return {name:"Казань",info:HUBS["Казань"]};
for(var k in HUBS){ if(s.indexOf(k.toLowerCase())>=0) return {name:k,info:HUBS[k]}; }
return {name:"Москва",info:HUBS["Москва"]};
}
function maps(q){return "https://yandex.ru/maps/?text="+encodeURIComponent(q);}
function makeRoutes(from,to,pax){
var h=pickHub(from,to);
return [
{id:"train",kind:"train",title:"Прямой поезд",badge:"Меньше суеты",score:"С багажом и ночь в купе",dur:"~13 ч",price:"от 2 500 ₽",lower:true,coupe:true,pax:pax,steps:[{t:"Посадка",w:"Станция «"+from+"» — точное имя смотрите в билете."},{t:"В пути",w:"Нижние места — нечётные. Двое коллег — одно купе."},{t:"Прибытие",w:"Вокзал «"+to+"», затем такси до объекта."}],tr:null},
{id:"bus",kind:"bus",title:"Прямой автобус",badge:"Чаще дешевле",score:"Сидячий, без купе",dur:"~12 ч",price:"от 1 800 ₽",lower:false,coupe:false,pax:pax,steps:[{t:"Автовокзал",w:"Приезжайте за 30–40 мин, посадка по паспорту."},{t:"В пути",w:"Места сидячие. Туалет/розетка не всегда."},{t:"Прибытие",w:"Автовокзал "+to+", далее такси 10–30 мин."}],tr:null},
{id:"m1",kind:"multi",title:"Поезд + автобус через "+h.name,badge:"Если прямого мало",score:"Пересадка в "+h.name,dur:"~16 ч",price:"от 2 800 ₽",lower:true,coupe:false,pax:pax,steps:[{t:"1. Поезд",w:from+" → "+h.name+". Выход: "+h.info.train+"."},{t:"2. Пересадка",w:h.info.how},{t:"3. Автобус",w:h.info.bus+" → "+to+". Билет на автобус берите заранее."}],tr:h},
{id:"m2",kind:"multi",title:"Автобус + поезд через "+h.name,badge:"Обратная стыковка",score:"Если утром удобнее автобус",dur:"~17 ч",price:"от 2 600 ₽",lower:true,coupe:true,pax:pax,steps:[{t:"1. Автобус",w:from+" → "+h.name+", прибытие: "+h.info.bus+"."},{t:"2. Пересадка",w:h.info.how+" Заложите ≥ 2 часа."},{t:"3. Поезд",w:h.info.train+" → "+to+"."}],tr:h},
{id:"night",kind:"train",title:"Ночной поезд",badge:"К утру на месте",score:"День не сгорает в дороге",dur:"~14 ч",price:"от 3 100 ₽",lower:true,coupe:true,pax:pax,steps:[{t:"Вечер",w:"Посадка на "+from+" после 18:00 (точное время — РЖД)."},{t:"Ночь",w:"Нижняя в купе. Двое: места 1 и 3 или 5 и 7."},{t:"Утро",w:""+to+", такси, к 10:00 можно быть на встрече."}],tr:null},
{id:"msk",kind:"multi",title:"Через Москву",badge:"Запасной",score:"Длиннее, но больше рейсов",dur:"~22 ч",price:"от 4 200 ₽",lower:true,coupe:true,pax:pax,steps:[{t:"1. До Москвы",w:from+" → вокзал из билета."},{t:"2. По Москве",w:HUBS["Москва"].how},{t:"3. Из Москвы",w:"Поезд/автобус → "+to+"."}],tr:{name:"Москва",info:HUBS["Москва"]}}
];}
function isLower(n){return n%2===1;}
function schemeHtml(r){
var pax=r.pax||1,html="";
if(r.coupe){html+="<p class='text-sm mb-2'>В кассе просите нижние в одном купе (нечётные).</p>";html+="<div class='grid grid-cols-3 gap-2'>";for(var c=1;c<=9;c++){html+="<div class='border rounded p-2 text-xs'>Купе "+c+"<div>"+(c*4-3)+"↓ "+(c*4-1)+"↓ "+(c*4-2)+"↑ "+(c*4)+"↑</div></div>";}html+="</div>";}
else if(r.lower) html+="<p class='text-sm'>Плацкарт: нечёт = низ. Для двоих — 1 и 3 в одном отсеке.</p>";
else html+="<p class='text-sm'>Автобус: сидячие места, купе нет.</p>";
return html;}
window.openSeat=function(id){var r=null;for(var i=0;i<ROUTES.length;i++) if(ROUTES[i].id===id) r=ROUTES[i]; if(!r) return;
document.getElementById("modalTitle").textContent=r.title; document.getElementById("modalSub").textContent=r.score;
document.getElementById("modalInfo").textContent="Схема ориентирует, какие места просить в РЖД.";
document.getElementById("modalScheme").innerHTML=schemeHtml(r);
var m=document.getElementById("seatModal"); m.hidden=false; m.style.display="flex";};
window.closeSeat=function(){var m=document.getElementById("seatModal");m.hidden=true;m.style.display="none";};
document.getElementById("modalClose").onclick=closeSeat;
document.getElementById("seatModal").onclick=function(e){if(e.target.id==="seatModal")closeSeat();};
document.getElementById("searchForm").onsubmit=function(e){
e.preventDefault();
var from=document.getElementById("fromCity").value.trim(), to=document.getElementById("toCity").value.trim();
var pax=+document.getElementById("passengers").value, mode=document.getElementById("transportMode").value;
var same=document.getElementById("sameCompartment").checked, low=document.getElementById("lowerBerths").checked;
ROUTES=makeRoutes(from,to,pax);
if(mode==="train") ROUTES=ROUTES.filter(function(r){return r.kind==="train";});
if(mode==="bus") ROUTES=ROUTES.filter(function(r){return r.kind==="bus";});
if(mode==="multi") ROUTES=ROUTES.filter(function(r){return r.kind==="multi";});
if(low) ROUTES=ROUTES.filter(function(r){return r.lower;});
if(same&&pax>=2) ROUTES=ROUTES.filter(function(r){return r.coupe;});
var box=document.getElementById("routesList");
if(!ROUTES.length){box.innerHTML="<div class='bg-yellow-50 border rounded-xl p-4'>Снимите фильтры</div>";return false;}
box.innerHTML=ROUTES.map(function(r){
var steps=r.steps.map(function(s,i){return "<div class='flex gap-3 mb-2'><div class='w-7 h-7 rounded-full bg-slate-800 text-white text-xs flex items-center justify-center shrink-0'>"+(i+1)+"</div><div><b class='text-sm'>"+s.t+"</b><div class='text-sm text-slate-600'>"+s.w+"</div></div></div>";}).join("");
var tr="";
if(r.tr){tr="<div class='mt-3 bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm'><b>Пересадка: "+r.tr.name+"</b><br>Поезд: "+r.tr.info.train+"<br>Автобус: "+r.tr.info.bus+"<br>"+r.tr.info.how+"<br><a class='text-blue-700 underline' target='_blank' href='"+maps(r.tr.name+" железнодорожный вокзал")+"'>Карта вокзала</a> · <a class='text-blue-700 underline' target='_blank' href='"+maps(r.tr.name+" автовокзал")+"'>Карта автовокзала</a></div>";}
return "<article class='bg-white border rounded-2xl p-5'><span class='text-xs bg-slate-100 px-2 py-1 rounded-full'>"+r.badge+"</span><h3 class='font-bold text-lg mt-1'>"+r.title+"</h3><p class='text-sm text-slate-500 mb-3'>"+r.score+" · "+r.dur+" · "+r.price+"</p>"+steps+tr+"<button type='button' onclick=\"openSeat('"+r.id+"')\" class='mt-3 px-4 py-2 bg-rzd-red text-white rounded-lg text-sm'>Места / схема</button></article>";
}).join("");
return false;};
})();
</script></body></html>
