<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Командировки v11</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:system-ui,sans-serif}.top{background:linear-gradient(135deg,#0f2744,#1d4e89)}</style>
</head>
<body class="bg-slate-100 min-h-screen">
<header class="top text-white"><div class="max-w-5xl mx-auto px-4 py-5">
<div class="text-xs tracking-widest text-blue-200">ПРОВЕРКА МЕСТ РЖД · БЕЗ ПОКУПКИ</div>
<h1 class="text-2xl font-semibold">Маршруты · v11</h1>
<p class="text-sm text-blue-100">Нижние и одно купе — из кассы РЖД через облако РФ</p>
</div></header>
<main class="max-w-5xl mx-auto px-4 py-6">
<form id="f" class="bg-white rounded-2xl border p-5 space-y-3">
<div class="grid md:grid-cols-2 gap-3">
<input id="from" class="px-3 py-3 border rounded-xl" required value="Казань" placeholder="Откуда">
<input id="to" class="px-3 py-3 border rounded-xl" required value="Екатеринбург" placeholder="Куда">
</div>
<div class="grid sm:grid-cols-3 gap-3">
<input type="date" id="date" class="px-3 py-3 border rounded-xl" required>
<select id="pax" class="px-3 py-3 border rounded-xl"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
<select id="xfer" class="px-3 py-3 border rounded-xl"><option value="any">Все рейсы</option><option value="direct">Только прямые</option></select>
</div>
<label class="text-sm flex gap-2 items-center"><input type="checkbox" id="need" checked> только где подходят нижние в одном купе</label>
<button class="px-6 py-3 bg-blue-800 text-white rounded-xl font-semibold">Проверить места</button>
<p id="st" class="text-sm text-slate-500"></p>
</form>
<div id="list" class="mt-5 space-y-3"></div>
</main>
<script>
var API="https://multimodal-routes.onrender.com";
try{var t=new Date();t.setDate(t.getDate()+3);document.getElementById("date").value=t.toISOString().slice(0,10);}catch(e){}
function fmt(s){if(!s)return "—";var d=new Date(s);if(isNaN(d))return String(s).slice(0,16);return d.toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}
function badge(v,yes,no,unk){
if(v===true) return "<span class='px-2 py-1 rounded-lg bg-emerald-100 text-emerald-800 text-xs'>"+yes+"</span>";
if(v===false) return "<span class='px-2 py-1 rounded-lg bg-rose-100 text-rose-800 text-xs'>"+no+"</span>";
return "<span class='px-2 py-1 rounded-lg bg-slate-100 text-slate-600 text-xs'>"+unk+"</span>";
}
document.getElementById("f").onsubmit=async function(e){
e.preventDefault();
var fr=from.value.trim(), to=to.value.trim(), date=date.value, pax=+pax.value;
var st=document.getElementById("st"), box=document.getElementById("list");
st.textContent="Спрашиваем РЖД в облаке… может занять до минуты."; box.innerHTML="";
try{
var j=await (await fetch(API+"/trains?from="+encodeURIComponent(fr)+"&to="+encodeURIComponent(to)+"&date="+date+"&pax="+pax)).json();
var trains=j.trains||[];
if(xfer.value==="direct") trains=trains.filter(function(x){return !x.has_transfers;});
if(document.getElementById("need").checked) trains=trains.filter(function(x){var r=x.rzd||{}; return r.same_coupe_lower===true || r.lower_enough===true && pax===1;});
st.textContent="Рейсов: "+trains.length+(j.rzd_error?(" · РЖД: "+j.rzd_error):(" · РЖД поездов с местами: "+(j.rzd_trains||0)));
if(!trains.length){box.innerHTML="<div class='bg-amber-50 border rounded-xl p-4'>Нет вариантов. Сними галочку фильтра или подожди деплой облака (новый метод /api/v1/seats/rzd). На контейнере включи RZD_AVAILABILITY_ENABLED=true.</div>";return;}
box.innerHTML=trains.map(function(x,i){
var r=x.rzd||{};
return "<article class='bg-white border rounded-2xl p-4'><div class='text-xs text-slate-500'>Вариант "+(i+1)+" · "+(x.number||"")+"</div><p class='font-medium mt-1'>"+fmt(x.dep)+" → "+fmt(x.arr)+" · "+(x.from||fr)+" — "+(x.to||to)+"</p><div class='flex flex-wrap gap-2 mt-3'>"+badge(r.same_coupe_lower,"одно купе + нижние: есть","одно купе на нижних: нет","купе не подтверждено")+badge(r.lower_enough,"нижних хватает","нижних мало","нижние: нет данных")+"<span class='text-xs text-slate-500'>нижних: "+(r.lower==null?"?":r.lower)+", всего мест: "+(r.available==null?"?":r.available)+"</span></div></article>";
}).join("");
}catch(err){st.textContent=String(err);}
};
</script></body></html>
