<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>МультиМаршрут</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui,sans-serif;color:#eef3f8;background:#071018;min-height:100vh}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(1200px 600px at 10% -10%,#1c4f7a 0%,transparent 55%),radial-gradient(900px 500px at 100% 0%,#7a4a18 0%,transparent 50%),linear-gradient(165deg,#05080d,#0c1a2b 48%,#122033)}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:28px 18px 64px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#f0d7a0,#b8893a);display:grid;place-items:center;font-weight:800;color:#2a1a05}
.brand{display:flex;gap:12px;align-items:center}.brand b{display:block;letter-spacing:.18em;font-size:11px;color:#d4b483}.brand span{font-size:13px;color:#9fb0c3}
.nav a{color:#f3e0b8;text-decoration:none;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(243,224,184,.18)}
.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.08;margin:0 0 10px;font-weight:800}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#fff,#f3e0b8,#c9974a);-webkit-background-clip:text;color:transparent}
.hero p{margin:0 0 22px;color:#b7c6d6}
.card{background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:22px}
.grid2{display:grid;gap:12px;grid-template-columns:1fr 1fr}.grid3{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
label.l{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#d4b483;margin-bottom:6px}
.field{position:relative}input,select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:#0b1624;color:#fff;font:inherit}
.sug{position:absolute;left:0;right:0;top:100%;z-index:20;margin:4px 0 0;padding:6px;border-radius:14px;background:#0d1b2c;border:1px solid rgba(255,255,255,.12);display:none;max-height:240px;overflow:auto}
.sug button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#eef3f8;padding:8px 10px;border-radius:10px;cursor:pointer;font:inherit}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
button.go{border:0;cursor:pointer;padding:13px 22px;border-radius:999px;font:inherit;font-weight:700;color:#1a1206;background:linear-gradient(180deg,#f6e2b4,#c8943c)}
.more,.mapbtn{margin-top:10px;border:1px solid rgba(243,224,184,.3);background:transparent;color:#f3e0b8;padding:10px 16px;border-radius:999px;cursor:pointer;font:inherit}
.more{display:none}#st{margin:12px 0 0;color:#9fb0c3;font-size:14px}.list{margin-top:18px;display:grid;gap:12px}
.trip{position:relative}.trip:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(#f3e0b8,#c8943c)}
.meta{font-size:12px;color:#9fb0c3}.when{font-size:18px;font-weight:700;margin:6px 0 8px}
.step{margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.22);font-size:13px}
.xfer{background:rgba(212,180,131,.12);border:1px dashed rgba(243,224,184,.25)}
.kind{display:inline-block;min-width:72px;color:#f3e0b8;font-weight:700;text-transform:uppercase;font-size:11px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.b{font-size:12px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06)}
.ok{background:rgba(46,160,110,.18);color:#b8f0d3}.no{background:rgba(180,60,60,.16);color:#f3b4b4}.muted{color:#8ea0b3}.sap{background:rgba(80,140,220,.22);color:#cfe4ff}
.warn{padding:16px;border-radius:16px;background:rgba(212,180,131,.1)}
.modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}.sheet{max-width:640px;width:100%;max-height:90vh;overflow:auto;background:#0d1a28;border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:20px}
.box{border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;margin-top:8px}
.seat{display:inline-block;margin:3px;padding:6px 8px;border-radius:8px;font-size:12px;background:rgba(255,255,255,.08)}
.seat.low{background:rgba(46,160,110,.3);color:#b8f0d3}
a.map{color:#f3e0b8}
</style></head>
<body>
<div class="bg"></div>
<div class="wrap">
<div class="nav"><div class="brand"><div class="mark">М</div><div><b>МУЛЬТИМАРШРУТ</b><span>поезд · автобус · пересадка</span></div></div><a href="hotels.html">Гостиницы</a></div>
<section class="hero"><h1>Поезд плюс автобус<br><em>если прямого нет — ищем с пересадкой</em></h1><p>В пересадке видно где вышли, куда идти и сколько ждать.</p></section>
<form id="f" class="card" autocomplete="off">
<div class="grid2">
<div class="field"><label class="l">Откуда</label><input id="orig" required value="Казань"><div class="sug" id="sug-orig"></div></div>
<div class="field"><label class="l">Куда</label><input id="dest" required value="Екатеринбург"><div class="sug" id="sug-dest"></div></div>
</div>
<div class="grid3" style="margin-top:12px">
<div><label class="l">Дата</label><input type="date" id="when" required></div>
<div><label class="l">Человек</label><select id="pax"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div>
<div><label class="l">Места</label>
<select id="seats">
<option value="">Любые</option>
<option value="coupe">Только в одном купе</option>
<option value="lower">Только нижние</option>
<option value="both">В одном купе только нижние</option>
</select></div>
</div>
<div class="row">
<div style="flex:1"><label class="l">Рейсы</label>
<select id="xfer">
<option value="any">Все</option>
<option value="sapsan">Сапсан / Ласточка</option>
<option value="train">Поезд</option>
<option value="bus">Автобус</option>
<option value="mix">Поезд и автобус</option>
</select></div>
<button class="go" type="submit">Найти маршрут</button>
</div>
<p id="st"></p>
</form>
<div id="list" class="list"></div>
<button class="more" id="more" type="button">Показать ещё</button>
</div>
<div class="modal" id="seatModal" onclick="if(event.target===this)this.classList.remove('show')">
<div class="sheet"><div class="row" style="margin:0 0 8px;justify-content:space-between"><b id="seatTitle">Вагоны</b><button class="mapbtn" type="button" onclick="document.getElementById('seatModal').classList.remove('show')">Закрыть</button></div><div id="seatGrid"></div></div>
</div>
<script>
var API="https://functions.yandexcloud.net/d4e5aa975qllld89nvh0";
var timers={}, shown=5, cache=[], lastQ={};
try{var t=new Date();t.setDate(t.getDate()+3);document.getElementById("when").value=t.toISOString().slice(0,10);}catch(e){}
function bindSuggest(id){
var inp=document.getElementById(id), box=document.getElementById("sug-"+id);
inp.addEventListener("input", function(){
clearTimeout(timers[id]); var q=inp.value.trim(); if(q.length<2){box.style.display="none";return;}
timers[id]=setTimeout(async function(){
try{var rows=await (await fetch(API+"?path=/suggest&q="+encodeURIComponent(q))).json();
box.innerHTML=(rows||[]).map(function(r){return "<button type='button'>"+r.title+"</button>";}).join("");
box.style.display=rows&&rows.length?"block":"none";
box.querySelectorAll("button").forEach(function(b){b.onclick=function(){inp.value=b.textContent;box.style.display="none";};});
}catch(e){box.style.display="none";}
},220);});
document.addEventListener("click", function(e){if(!box.contains(e.target)&&e.target!==inp) box.style.display="none";});
}
bindSuggest("orig"); bindSuggest("dest");
function fmt(s){if(!s)return "—";var d=new Date(s);if(isNaN(d))return String(s).slice(0,16);return d.toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}
function mins(a,b){var x=new Date(a),y=new Date(b); if(isNaN(x)||isNaN(y)) return null; return Math.round((y-x)/60000);}
function isSap(x){var t=((x.name||"")+" "+(x.number||"")).toLowerCase(); return /сапсан|sapsan|ласточк/.test(t) || /^7[5-7]/.test(String(x.number||""));}
function typesOf(x){var d=x.details||[]; if(d.length) return d.map(function(p){return String(p.type||"");}); return [String(x.type||"")];}
function isBus(x){var t=typesOf(x).join(" ").toLowerCase()+" "+(x.type||""); return /bus|авто/.test(t) && !isMix(x) && !isSap(x);}
function isMix(x){if(x.type==="mixed"||x.hub) return true; var t=typesOf(x).join(" ").toLowerCase(); return /bus|авто/.test(t) && /train|поезд/.test(t);}
function isTrainOnly(x){ if(isSap(x)||isMix(x)||isBus(x)) return false; return x.type==="train" || /train|поезд/.test(typesOf(x).join(" ").toLowerCase()) || !x.has_transfers;}
function kind(t,x){if(x&&isSap(x)) return "сапсан"; t=String(t||""); if(/bus|авто/.test(t)) return "автобус"; if(/mix/.test(t)) return "связка"; return "поезд";}
function badge(v,yes,no,unk){if(v===true)return "<span class='b ok'>"+yes+"</span>";if(v===false)return "<span class='b no'>"+no+"</span>";return "<span class='b muted'>"+unk+"</span>";}
function okSeat(r, mode){if(!r || !mode) return true; if(mode==="both") return r.same_coupe_lower===true; if(mode==="coupe") return r.same_coupe===true || r.same_coupe_lower===true; if(mode==="lower") return r.lower_enough===true || r.same_coupe_lower===true; return true;}
function maps(q){return "https://yandex.ru/maps/?text="+encodeURIComponent(q);}
function howGo(aType,bType,fromSt,toSt,city){
var a=/bus|авто/.test(String(aType||"")) ? "автовокзал" : "ж/д вокзал";
var b=/bus|авто/.test(String(bType||"")) ? "автовокзал" : "ж/д вокзал";
if(fromSt && toSt && fromSt!==toSt) return "Вышли на <b>"+fromSt+"</b>. Идите на <b>"+toSt+"</b> ("+a+" → "+b+").";
return "Пересадка в "+(city||fromSt||"узле")+": "+a+" → "+b+".";
}
function steps(x){
var d=x.details||[], html="";
if(!d.length) html="<div class='step'><span class='kind'>"+kind(x.type,x)+"</span> "+(x.from||"")+" → "+(x.to||"")+"</div>";
else d.forEach(function(p,i){
html+="<div class='step'><span class='kind'>"+(i+1)+". "+kind(p.type,p)+"</span> "+fmt(p.dep)+" <b>"+(p.from||"")+"</b> → "+fmt(p.arr)+" <b>"+(p.to||"")+"</b>"+(p.number?(" · № "+p.number):"")+"</div>";
if(d[i+1]){
var w=mins(p.arr,d[i+1].dep);
var city=x.hub||p.to||d[i+1].from;
var tip=howGo(p.type,d[i+1].type,p.to,d[i+1].from,city);
var q=(p.to||"")+" "+(d[i+1].from||city||"");
html+="<div class='step xfer'><span class='kind'>пересадка</span> "+tip+" Ждать: <b>"+(w!=null?(w+" мин"):"—")+"</b>. <a class='map' target='_blank' href='"+maps(q)+"'>карта пересадки</a></div>";
}
});
return html;
}
function seatNums(val){var out=[]; String(Array.isArray(val)?val.join(","):(val||"")).split(/[^0-9]+/).forEach(function(x){ if(x) out.push(+x); }); return out;}
function allSeats(c){var n=seatNums(c.free); (c.compartments||[]).forEach(function(k){ n=n.concat(seatNums(k.places||k.Places||k.freePlaces||k)); }); return n;}
function isLow(n){ return n%2===1; }
function card(x,i){
var r=x.rzd||{}, sap=isSap(x);
var cnt=(r.lower!=null?("нижних "+r.lower+" / всего "+ (r.available||"—")):"");
return "<article class='card trip'><div class='meta'>Вариант "+(i+1)+" · "+(x.name||x.number||"")+(x.number?(" · № "+x.number):"")+(isMix(x)?" · с пересадкой":"")+"</div><div class='when'>"+fmt(x.dep)+" → "+fmt(x.arr)+"</div>"+steps(x)+"<div class='badges'>"+(sap?"<span class='b sap'>Сапсан</span>":"")+badge(r.same_coupe_lower||r.same_coupe,"одно купе","купе нет","купе: нет данных")+badge(r.lower_enough,"нижние есть","нижних мало","нижние: нет данных")+(cnt?"<span class='b'>"+cnt+"</span>":"")+"</div><button class='mapbtn' type='button' onclick='openMap("+i+")'>Вагоны и купе</button></article>";
}
async function openMap(i){
var x=cache[i]||{}, r=x.rzd||{};
document.getElementById("seatTitle").textContent="Вагоны · "+(x.number||x.name||"");
document.getElementById("seatGrid").innerHTML="<p class='meta'>Загружаю…</p>";
document.getElementById("seatModal").classList.add("show");
var cars=(r.groups||[]).slice();
try{var j=await (await fetch(API+"?path=/cars&from="+encodeURIComponent(lastQ.fr)+"&to="+encodeURIComponent(lastQ.to)+"&date="+lastQ.date+"&train="+encodeURIComponent(x.number||"")+"&dep="+encodeURIComponent(x.dep||"")+"&pax="+lastQ.pax)).json(); if(j.cars&&j.cars.length) cars=j.cars;}catch(e){}
if(!cars.length){document.getElementById("seatGrid").innerHTML="<p class='meta'>Касса не отдала вагоны.</p>";return;}
document.getElementById("seatGrid").innerHTML=cars.map(function(c,n){
var seats=allSeats(c), low=seats.filter(isLow);
var title=(c.car?("Вагон "+c.car+" · "):("Группа "+(n+1)+" · "))+(c.type||"");
var comps=c.compartments||[], compHtml="";
if(comps.length){compHtml=comps.map(function(k,i){var places=seatNums(k.places||k.Places||k.freePlaces||k), lows=places.filter(isLow); return "<div class='meta'>Купе "+(k.compartment||k.Compartment||(i+1))+": "+places.map(function(p){return "<span class='seat "+(isLow(p)?"low":"")+"'>"+p+(isLow(p)?" низ":" верх")+"</span>";}).join(" ")+(lows.length?" · нижних "+lows.length:" · нижних нет")+"</div>";}).join("");}
else if(seats.length){compHtml="<div class='meta'>"+seats.map(function(p){return "<span class='seat "+(isLow(p)?"low":"")+"'>"+p+(isLow(p)?" низ":" верх")+"</span>";}).join("")+"</div>";}
return "<div class='box'><b>"+title+"</b><div class='meta'>свободно "+(c.available||seats.length)+" · нижних "+low.length+(low.length?(" (№ "+low.join(", ")+")"):" нет")+"</div>"+compHtml+"</div>";
}).join("");
}
function byMode(list, mode){
if(mode==="sapsan") return list.filter(isSap);
if(mode==="train") return list.filter(isTrainOnly);
if(mode==="bus") return list.filter(isBus);
if(mode==="mix") return list.filter(isMix);
return list.slice();
}
function draw(){document.getElementById("list").innerHTML=cache.slice(0,shown).map(card).join(""); var btn=document.getElementById("more"); btn.style.display=shown<cache.length?"block":"none"; btn.textContent="Показать ещё ("+(cache.length-shown)+")";}
document.getElementById("more").onclick=function(){shown+=5; draw();};
document.getElementById("f").onsubmit=async function(e){
e.preventDefault();
lastQ={fr:document.getElementById("orig").value.trim(), to:document.getElementById("dest").value.trim(), date:document.getElementById("when").value, pax:+document.getElementById("pax").value};
var modeSeat=document.getElementById("seats").value, mode=document.getElementById("xfer").value;
var st=document.getElementById("st"); st.textContent="Ищем…"; document.getElementById("list").innerHTML=""; document.getElementById("more").style.display="none"; shown=5;
try{
var j=await (await fetch(API+"?path=/trains&from="+encodeURIComponent(lastQ.fr)+"&to="+encodeURIComponent(lastQ.to)+"&date="+lastQ.date+"&pax="+lastQ.pax)).json();
var all=j.trains||[], note="";
var trains=byMode(all, mode);
var hasSeat=all.some(function(x){return x.rzd;});
if(modeSeat && hasSeat) trains=trains.filter(function(x){return isSap(x)||okSeat(x.rzd||{}, modeSeat);});
if(!trains.length && mode!=="any"){
var extra=all.filter(function(x){return isMix(x) || x.has_transfers;});
if(modeSeat && hasSeat) extra=extra.filter(function(x){return isSap(x)||okSeat(x.rzd||{}, modeSeat);});
if(extra.length){ trains=extra; note=" · прямых нет, показаны с пересадкой"; }
}
cache=trains;
st.textContent="Вариантов: "+trains.length+note+(j.rzd_error?" · РЖД не ответила":(" · РЖД: "+(j.rzd_trains||0)));
if(!trains.length){document.getElementById("list").innerHTML="<div class='warn'>Нет вариантов даже с пересадкой.</div>";return;} draw();
}catch(err){st.textContent=String(err);}
};
</script></body></html>
